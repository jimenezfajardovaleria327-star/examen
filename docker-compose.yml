name: examen-datamart-125055397

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-datamart}
      POSTGRES_USER: ${DB_USER:-datamart}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-this-local-password}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - datamart

  hadoop:
    build:
      context: .
      dockerfile: hadoop/Dockerfile
    environment:
      DATASET_FILE: /data/input/ventas_125055397.csv
      OUTPUT_DIR: /data/output
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-datamart}
      DB_USER: ${DB_USER:-datamart}
      DB_PASSWORD: ${DB_PASSWORD:-change-this-local-password}
    volumes:
      - ${DATASET_PATH:-../../practica1.py/ventas_125055397.csv}:/data/input/ventas_125055397.csv:ro
      - pipeline_output:/data/output
      - ssh_shared:/run/ssh-shared
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "ssh-keyscan -T 2 localhost >/dev/null 2>&1"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 10s
    networks:
      - datamart

  api:
    build:
      context: ./api
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-datamart}
      DB_USER: ${DB_USER:-datamart}
      DB_PASSWORD: ${DB_PASSWORD:-change-this-local-password}
      PORT: 5000
    volumes:
      - ssh_shared:/run/ssh-shared:ro
    depends_on:
      db:
        condition: service_healthy
      hadoop:
        condition: service_healthy
    ports:
      - "${API_PORT:-5001}:5000"
    networks:
      - datamart

volumes:
  db_data:
  pipeline_output:
  ssh_shared:

networks:
  datamart:
    driver: bridge